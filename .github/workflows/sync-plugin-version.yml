name: Sync Plugin Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set (without v prefix, e.g., 0.2.1)'
        required: true

jobs:
  sync-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update plugin.json
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' sharpitect-plugin/.claude-plugin/plugin.json > tmp.json
          mv tmp.json sharpitect-plugin/.claude-plugin/plugin.json

      - name: Update marketplace.json
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          jq --arg v "$VERSION" '.plugins[0].version = $v' .claude-plugin/marketplace.json > tmp.json
          mv tmp.json .claude-plugin/marketplace.json

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sharpitect-plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: sync plugin version to $VERSION"
          git push
